[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "floptician"
version = "0.1.0"
description = "Real-time poker card detection with YOLOv8, OBS, and WebSocket overlay"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "Pillow",
    "pyyaml",
    "websocket-server",
    "obsws-python",
    "ultralytics",
    "aioconsole",
    "imageio-ffmpeg",
    "typer>=0.9",
    "rich>=13.0",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
windows = ["pygrabber"]
coreml = ["coremltools"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.scripts]
floptician = "floptician.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]
