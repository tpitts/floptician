debug: false
host: 'localhost'
http_port: 8000
websocket_port: 9001
html_file: 'src/floptician/static/overlay.html'
output_dir: 'output'

obs:
  host: 'localhost'
  port: 4455
  password: ''

capture:
  mode: 'direct_webcam'  # 'obs_websocket' or 'direct_webcam'
  width: 640
  height: 360
  fps: 1.8
  # swap_channels: true  # Enable if card detection fails (BGR/RGB mismatch)

yolo:
  model: 'models/yolov8l-2026-03-10.pt'
  confidence_threshold: 0.70
  overlap_threshold: 0.80

board_processor:
  vertical_alignment_threshold: 0.20
  # Both count AND elapsed time must agree on the complete board.
  # Applies equally to additions, corrections, rearrangements, and layout changes.
  min_frames_to_show: 3
  min_ms_to_show: 1200
  # Partial disappearance holds the complete board until this slower gate is met.
  min_frames_to_remove: 6
  min_ms_to_remove: 4200
