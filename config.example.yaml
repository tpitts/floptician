debug: false
host: 'localhost'
http_port: 8000
websocket_port: 9001
html_file: 'src/floptician/static/overlay.html'
output_dir: 'output'

obs:
  host: 'localhost'
  port: 4455
  password: ''

capture:
  mode: 'direct_webcam'  # 'obs_websocket' or 'direct_webcam'
  width: 640  # OBS screenshot mode only; direct capture preserves native resolution.
  height: 360
  fps: 1.8  # Detection sampling rate, independent of camera frame rate.
  camera_width: 1280  # Requested native camera mode, passed directly to model preprocessing.
  camera_height: 720
  camera_fps: 30
  # swap_channels: true  # Enable if card detection fails (BGR/RGB mismatch)

yolo:
  model: 'models/yolov8l-2026-08-29.pt'
  # On Apple Silicon, export and verify the matching .mlpackage before selecting it here.
  image_size: 1280
  coreml_compute_unit: 'cpu-and-ne'  # Leaves the GPU available for OBS; ignored by .pt models.
  confidence_threshold: 0.70
  overlap_threshold: 0.80

board_processor:
  vertical_alignment_threshold: 0.20
  # Both count AND elapsed time must agree on the complete board.
  # Applies equally to additions, corrections, rearrangements, and layout changes.
  min_frames_to_show: 3
  min_ms_to_show: 1200
  # Partial disappearance holds the complete board until this slower gate is met.
  min_frames_to_remove: 6
  min_ms_to_remove: 4200
